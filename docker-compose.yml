services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kazus}
      POSTGRES_USER: ${POSTGRES_USER:-kazus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kazus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kazus} -d ${POSTGRES_DB:-kazus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kazus}:${POSTGRES_PASSWORD:-kazus}@db:5432/${POSTGRES_DB:-kazus}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-32-bytes-minimum-xxxxxx}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-kazus}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-globalocal}
      DEFAULT_COINS: ${DEFAULT_COINS:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        # wait for FastAPI startup hook (schema + admin + default coins seed)
        # to finish, otherwise the very first cycle sees an empty DB and
        # idles for REFRESH_INTERVAL_SEC.
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kazus}:${POSTGRES_PASSWORD:-kazus}@db:5432/${POSTGRES_DB:-kazus}
      REFRESH_INTERVAL_SEC: ${REFRESH_INTERVAL_SEC:-300}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_TIMEFRAMES: ${ALERT_TIMEFRAMES:-D1,H1}
      # Headless chart renderer (Stage 4b infra, wired in Stage 5). Shares
      # JWT_SECRET with backend so the worker can mint tokens that the
      # /api/chart endpoint accepts.
      JWT_SECRET: ${JWT_SECRET:-change-me-please-32-bytes-minimum-xxxxxx}
      CHART_RENDER_BASE_URL: ${CHART_RENDER_BASE_URL:-http://frontend}
      CHART_RENDER_USERNAME: ${CHART_RENDER_USERNAME:-${ADMIN_USERNAME:-kazus}}
      # X-zoom for the setup (LTF) chart in Telegram alerts. 1.0 = no zoom.
      CHART_RENDER_ZOOM: ${CHART_RENDER_ZOOM:-3.0}
      # Day-1 collection watchdog — value-based continuity guard. Baseline is a
      # DECLARED constant (not live pins); threshold is shell-overridable so a
      # fire-test can use a low value without a code change.
      WATCHDOG_BASELINE: ${WATCHDOG_BASELINE:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT}
      WATCHDOG_POLL_SECONDS: ${WATCHDOG_POLL_SECONDS:-60}
      WATCHDOG_STALL_THRESHOLD_SECONDS: ${WATCHDOG_STALL_THRESHOLD_SECONDS:-900}
      WATCHDOG_CONN_STORM: ${WATCHDOG_CONN_STORM:-12}

  # User-facing traffic is served by the pm2-managed `kazus-frontend` vite
  # process on the host (port 8080), not by this container. The container is
  # kept because the worker's Playwright chart renderer navigates to
  # http://frontend/chart-export over the compose network to produce the
  # images attached to Telegram alerts. Host port 8080 is deliberately NOT
  # mapped here — pm2 owns it, and mapping it made `docker compose up` fail.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"

volumes:
  pgdata:
