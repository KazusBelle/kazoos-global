server {
  listen 80;
  server_name _;

  # Allow up to 50 MB for TDA photo uploads (base64-encoded images).
  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS resolver so upstream hostnames can resolve at request time.
  resolver 127.0.0.11 ipv6=off valid=30s;
  set $backend_upstream http://backend:8000;

  # API reverse proxy → backend container
  location /api/ {
    # With variable-based proxy_pass, keep full original URI (/api/...)
    # by omitting the URI suffix here.
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass $backend_upstream/healthz;
  }

  # Never cache the SPA entrypoint so browser always picks latest hashed assets.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    expires -1;
    try_files $uri =404;
  }

  # Cache hashed bundles aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
